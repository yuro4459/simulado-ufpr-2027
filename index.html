<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado UFPR 2027 - 80 Questões</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0d0d3d 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 40px 30px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2a5298 50%, #1e3a5f 100%);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 2px solid #3a7bd5;
            box-shadow: 0 0 40px rgba(58, 123, 213, 0.3);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            animation: shimmer 8s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translate(-20%, -20%) rotate(0deg); }
            50% { transform: translate(20%, 20%) rotate(180deg); }
        }

        .header h1 {
            font-size: 2.2em;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            position: relative;
            text-shadow: 0 0 20px rgba(58, 123, 213, 0.5);
        }

        .header h2 {
            font-size: 1.1em;
            font-weight: 500;
            color: #a0c4ff;
            position: relative;
        }

        .header .badge {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 8px 20px;
            border-radius: 30px;
            margin-top: 15px;
            font-size: 0.9em;
            color: #ffd700;
            font-weight: 600;
            position: relative;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .score-panel {
            background: linear-gradient(135deg, #1a2a4a 0%, #243b6a 100%);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid #3a5a8a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: sticky;
            top: 10px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .score-item {
            text-align: center;
        }

        .score-item .number {
            font-size: 2em;
            font-weight: 800;
            display: block;
        }

        .score-item .label {
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8899bb;
            margin-top: 4px;
        }

        .score-correct .number { color: #00e676; }
        .score-wrong .number { color: #ff5252; }
        .score-total .number { color: #ffd700; }
        .score-percent .number { color: #40c4ff; }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #00e676, #40c4ff);
            transition: width 0.5s ease;
            width: 0%;
        }

        .section-header {
            background: linear-gradient(135deg, #2a3a5a 0%, #3a4a7a 100%);
            padding: 20px 30px;
            border-radius: 14px;
            margin: 35px 0 20px;
            border-left: 5px solid #ffd700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .section-header h3 {
            font-size: 1.3em;
            font-weight: 700;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-header p {
            color: #8899bb;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .text-box {
            background: linear-gradient(135deg, #1a2440 0%, #1e2d50 100%);
            border-left: 4px solid #40c4ff;
            padding: 20px 25px;
            border-radius: 0 12px 12px 0;
            margin: 15px 0;
            font-style: italic;
            line-height: 1.7;
            color: #c0d0e0;
        }

        .text-box .author {
            font-style: normal;
            font-weight: 600;
            color: #40c4ff;
            display: block;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .text-box-label {
            font-weight: 700;
            color: #ffd700;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-style: normal;
        }

        .question-card {
            background: linear-gradient(135deg, #141e3a 0%, #1a2848 100%);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #2a3a5a;
            transition: all 0.3s ease;
        }

        .question-card:hover {
            border-color: #3a5a8a;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .question-card.answered-correct {
            border-color: #00e676;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.15);
        }

        .question-card.answered-wrong {
            border-color: #ff5252;
            box-shadow: 0 0 20px rgba(255, 82, 82, 0.15);
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3a7bd5, #2a5298);
            border-radius: 50%;
            font-weight: 800;
            font-size: 0.95em;
            color: #fff;
            margin-bottom: 12px;
        }

        .question-type {
            display: inline-block;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 0.7em;
            font-weight: 600;
            margin-left: 10px;
            vertical-align: middle;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 0.95em;
            line-height: 1.7;
            margin-bottom: 18px;
            color: #d0d8e8;
        }

        .question-text .formula {
            background: rgba(255,255,255,0.08);
            padding: 8px 15px;
            border-radius: 8px;
            display: inline-block;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            color: #40c4ff;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
            color: #c0c8d8;
            text-align: left;
            width: 100%;
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
        }

        .option-btn:hover:not(.disabled) {
            background: rgba(58, 123, 213, 0.15);
            border-color: #3a7bd5;
            transform: translateX(5px);
        }

        .option-btn .option-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            font-weight: 700;
            font-size: 0.85em;
            color: #8899bb;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .option-btn.correct {
            background: rgba(0, 230, 118, 0.15) !important;
            border-color: #00e676 !important;
            color: #a0f0c0 !important;
        }

        .option-btn.correct .option-letter {
            background: #00e676 !important;
            color: #0a0a2e !important;
        }

        .option-btn.wrong {
            background: rgba(255, 82, 82, 0.15) !important;
            border-color: #ff5252 !important;
            color: #ffa0a0 !important;
        }

        .option-btn.wrong .option-letter {
            background: #ff5252 !important;
            color: #fff !important;
        }

        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-btn.show-correct {
            border-color: #00e676 !important;
            opacity: 1 !important;
        }

        .option-btn.show-correct .option-letter {
            background: #00e676 !important;
            color: #0a0a2e !important;
        }

        .feedback {
            margin-top: 12px;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 0.85em;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            display: block;
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: #00e676;
        }

        .feedback.wrong {
            display: block;
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3);
            color: #ff5252;
        }

        /* SOMA QUESTIONS */
        .soma-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .soma-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
            color: #c0c8d8;
            line-height: 1.5;
        }

        .soma-item:hover:not(.disabled) {
            background: rgba(58, 123, 213, 0.15);
            border-color: #3a7bd5;
        }

        .soma-item.selected {
            background: rgba(58, 123, 213, 0.2);
            border-color: #3a7bd5;
        }

        .soma-item .soma-value {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            font-weight: 700;
            font-size: 0.8em;
            color: #ffd700;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .soma-item.selected .soma-value {
            background: #3a7bd5;
            color: #fff;
        }

        .soma-item.disabled {
            cursor: not-allowed;
        }

        .soma-item.item-correct {
            background: rgba(0, 230, 118, 0.15) !important;
            border-color: #00e676 !important;
        }

        .soma-item.item-correct .soma-value {
            background: #00e676 !important;
            color: #0a0a2e !important;
        }

        .soma-item.item-wrong {
            background: rgba(255, 82, 82, 0.15) !important;
            border-color: #ff5252 !important;
        }

        .soma-item.item-wrong .soma-value {
            background: #ff5252 !important;
            color: #fff !important;
        }

        .soma-item.item-missed {
            border-color: #ffd700 !important;
            opacity: 1 !important;
        }

        .soma-item.item-missed .soma-value {
            background: #ffd700 !important;
            color: #0a0a2e !important;
        }

        .soma-confirm-btn {
            margin-top: 12px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #3a7bd5, #2a5298);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .soma-confirm-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(58, 123, 213, 0.4);
        }

        .soma-confirm-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .soma-result {
            margin-top: 8px;
            font-size: 0.85em;
            color: #8899bb;
        }

        .reset-btn {
            display: block;
            margin: 40px auto;
            padding: 16px 50px;
            background: linear-gradient(135deg, #ff5252, #d32f2f);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 82, 82, 0.4);
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: #556;
            font-size: 0.8em;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header h1 { font-size: 1.4em; letter-spacing: 1px; }
            .header h2 { font-size: 0.9em; }
            .question-card { padding: 18px; }
            .score-panel { padding: 15px; }
            .score-item .number { font-size: 1.5em; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📝 Simulado UFPR 2027</h1>
        <h2>Prova de Conhecimentos Gerais — 80 Questões</h2>

</div>

const letters = ['A', 'B', 'C', 'D', 'E'];
let correctCount = 0;
let wrongCount = 0;
let answeredCount = 0;
const totalQuestions = 80;

function buildQuiz() {
    const container = document.getElementById('questionsContainer');
    let html = '';
    let currentSection = '';

    questionsData.forEach((item, index) => {
        // Section headers
        if (item.section) {
            currentSection = item.section;
            html += `<div class="section-header">
                <h3>📚 ${item.section}</h3>
                <p>${item.sectionSub || ''}</p>
            </div>`;
        }

        // Text boxes (standalone)
        if (item.textBefore && !item.id) {
            html += buildTextBox(item.textBefore);
            return;
        }

        if (!item.id) return;

        // Question card
        html += `<div class="question-card" id="qcard-${item.id}">`;

        // Inline text box
        if (item.textBefore) {
            html += buildTextBox(item.textBefore);
        }

        html += `<div class="question-number">${item.id}</div>`;

        if (item.type === 'soma') {
            html += `<span class="question-type">Soma</span>`;
        }

        html += `<div class="question-text">${item.text}</div>`;

        if (item.type === 'multiple') {
            html += `<div class="options" id="options-${item.id}">`;
            item.options.forEach((opt, oi) => {
                html += `<button class="option-btn" id="opt-${item.id}-${oi}" onclick="selectOption(${item.id}, ${oi}, ${item.answer})">
                    <span class="option-letter">${letters[oi]}</span>
                    <span>${opt}</span>
                </button>`;
            });
            html += `</div>`;
        } else if (item.type === 'soma') {
            html += `<div class="soma-container" id="soma-${item.id}">`;
            item.items.forEach((si, sii) => {
                html += `<div class="soma-item" id="soma-item-${item.id}-${sii}" onclick="toggleSoma(${item.id}, ${sii})">
                    <span class="soma-value">(${String(si.value).padStart(2, '0')})</span>
                    <span>${si.text}</span>
                </div>`;
            });
            html += `</div>`;
            html += `<button class="soma-confirm-btn" id="soma-btn-${item.id}" onclick="confirmSoma(${item.id})">✔ Confirmar Resposta</button>`;
            html += `<div class="soma-result" id="soma-result-${item.id}"></div>`;
        }

        html += `<div class="feedback" id="feedback-${item.id}"></div>`;
        html += `</div>`;
    });

    container.innerHTML = html;
}

function buildTextBox(tb) {
    return `<div class="text-box">
        <div class="text-box-label">${tb.label || ''}</div>
        ${tb.content}
        ${tb.author ? `<span class="author">${tb.author}</span>` : ''}
    </div>`;
}

function selectOption(qId, selected, correct) {
    const optionsDiv = document.getElementById(`options-${qId}`);
    const buttons = optionsDiv.querySelectorAll('.option-btn');

    // Prevent double answers
    if (buttons[0].classList.contains('disabled')) return;

    buttons.forEach((btn, i) => {
        btn.classList.add('disabled');
        if (i === correct) {
            btn.classList.add('show-correct');
        }
    });

    const card = document.getElementById(`qcard-${qId}`);
    const feedback = document.getElementById(`feedback-${qId}`);

    if (selected === correct) {
        buttons[selected].classList.add('correct');
        card.classList.add('answered-correct');
        feedback.className = 'feedback correct';
        feedback.textContent = '✅ Resposta correta!';
        correctCount++;
    } else {
        buttons[selected].classList.add('wrong');
        buttons[correct].classList.add('correct');
        card.classList.add('answered-wrong');
        feedback.className = 'feedback wrong';
        feedback.textContent = `❌ Resposta incorreta. A alternativa correta é: ${letters[correct]}.`;
        wrongCount++;
    }

    answeredCount++;
    updateScore();
}

// Soma question state
const somaSelections = {};

function toggleSoma(qId, itemIndex) {
    const item = document.getElementById(`soma-item-${qId}-${itemIndex}`);
    if (item.classList.contains('disabled')) return;

    if (!somaSelections[qId]) somaSelections[qId] = new Set();

    if (somaSelections[qId].has(itemIndex)) {
        somaSelections[qId].delete(itemIndex);
        item.classList.remove('selected');
    } else {
        somaSelections[qId].add(itemIndex);
        item.classList.add('selected');
    }
}

function confirmSoma(qId) {
    const qData = questionsData.find(q => q.id === qId);
    if (!qData) return;

    const btn = document.getElementById(`soma-btn-${qId}`);
    if (btn.disabled) return;
    btn.disabled = true;

    const selected = somaSelections[qId] || new Set();
    let userSum = 0;

    qData.items.forEach((si, sii) => {
        const el = document.getElementById(`soma-item-${qId}-${sii}`);
        el.classList.add('disabled');

        const wasSelected = selected.has(sii);

        if (si.correct && wasSelected) {
            el.classList.add('item-correct');
            userSum += si.value;
        } else if (!si.correct && wasSelected) {
            el.classList.add('item-wrong');
            userSum += si.value;
        } else if (si.correct && !wasSelected) {
            el.classList.add('item-missed');
        }
    });

    const card = document.getElementById(`qcard-${qId}`);
    const feedback = document.getElementById(`feedback-${qId}`);
    const result = document.getElementById(`soma-result-${qId}`);

    result.innerHTML = `Sua soma: <strong>${userSum}</strong> | Soma correta: <strong>${qData.answer}</strong>`;

    if (userSum === qData.answer) {
        card.classList.add('answered-correct');
        feedback.className = 'feedback correct';
        feedback.textContent = `✅ Resposta correta! Soma = ${qData.answer}`;
        correctCount++;
    } else {
        card.classList.add('answered-wrong');
        feedback.className = 'feedback wrong';
        feedback.textContent = `❌ Resposta incorreta. Soma correta = ${qData.answer}. Itens em amarelo são os que faltaram.`;
        wrongCount++;
    }

    answeredCount++;
    updateScore();
}

function updateScore() {
    document.getElementById('correctCount').textContent = correctCount;
    document.getElementById('wrongCount').textContent = wrongCount;
    document.getElementById('answeredCount').textContent = `${answeredCount}/${totalQuestions}`;

    const pct = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
    document.getElementById('percentCount').textContent = `${pct}%`;

    const progressPct = Math.round((answeredCount / totalQuestions) * 100);
    document.getElementById('progressBar').style.width = `${progressPct}%`;
}

function resetQuiz() {
    correctCount = 0;
    wrongCount = 0;
    answeredCount = 0;
    Object.keys(somaSelections).forEach(k => delete somaSelections[k]);
    updateScore();
    buildQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Initialize
buildQuiz();
